<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Grátis — Projeto Imediato</title>
<meta name="description" content="Descubra em 2 minutos a situação do seu imóvel em Campinas: foto aérea, zoneamento e código cartográfico da Prefeitura.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#FF6900; --petroleo:#2E4453; --creme:#FBF8F4;
    --texto:#404040; --texto2:#6B6B6B; --borda:#e6e0d8; --verde:#25D366;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans",system-ui,sans-serif;color:var(--texto);
    background:var(--creme);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,105,0,.06), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(46,68,83,.07), transparent 46%),
      linear-gradient(180deg, #fbf8f4 0%, #f4efe7 100%);
    background-attachment:fixed;min-height:100vh}

  .topo{background:linear-gradient(135deg,#2E4453 0%,#263a47 100%);color:#fff;
    padding:20px 22px;text-align:center;
    box-shadow:inset 0 -3px 0 rgba(255,105,0,.85)}
  .topo .marca{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
  .topo h1{margin:7px 0 0;font-size:22px;font-weight:700;letter-spacing:-.2px}

  .palco{max-width:660px;margin:26px auto 60px;padding:0 18px}
  .cartao{background:#fff;border-radius:16px;padding:32px 30px 28px;
    box-shadow:0 1px 2px rgba(46,68,83,.06), 0 12px 34px rgba(46,68,83,.10);
    border:1px solid rgba(46,68,83,.06)}

  .bolinhas{display:flex;gap:9px;justify-content:center;margin-bottom:26px}
  .bolinha{width:11px;height:11px;border-radius:50%;background:#ddd6cb;transition:background .25s}
  .bolinha.feita{background:var(--laranja)}
  .bolinha.atual{background:var(--laranja);box-shadow:0 0 0 4px rgba(255,105,0,.18)}

  h2{font-size:23px;margin:0 0 6px;color:var(--petroleo);font-weight:700}
  .ajuda{color:var(--texto2);font-size:14.5px;margin:0 0 22px;line-height:1.5}

  label.campo{display:block;font-size:13px;font-weight:600;color:var(--texto);margin:16px 0 7px}
  input[type=text],input[type=number],textarea,select{
    width:100%;padding:13px 14px;border:1.5px solid var(--borda);border-radius:9px;
    font-size:15px;font-family:inherit;color:var(--texto);background:#fff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--laranja)}
  textarea{min-height:88px;resize:vertical}

  .opcoes{display:grid;gap:10px;margin-top:6px}
  .opcoes.duas{grid-template-columns:1fr 1fr}
  .opcao{display:flex;align-items:center;gap:11px;border:1.5px solid var(--borda);border-radius:10px;
    padding:14px 15px;cursor:pointer;font-size:14.5px;background:#fff;transition:border-color .15s,background .15s}
  .opcao:hover{border-color:#c9bfae}
  .opcao input{accent-color:var(--laranja);width:17px;height:17px;flex:0 0 auto;margin:0}
  .opcao.marcada{border-color:var(--laranja);background:#fff8f2}

  .sugestoes{list-style:none;margin:6px 0 0;padding:0;max-height:190px;overflow-y:auto;
    border:1.5px solid var(--borda);border-radius:9px;display:none;background:#fff}
  .sugestoes li{padding:11px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #f2ede6}
  .sugestoes li:last-child{border-bottom:none}
  .sugestoes li:hover{background:var(--creme)}

  .navegacao{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
  button{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:30px;
    padding:14px 30px;cursor:pointer;transition:filter .15s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .voltar{background:#eee7dc;color:var(--petroleo)}
  .proximo{background:var(--petroleo);color:#fff}
  .zap{background:var(--verde);color:#fff;width:100%;font-size:16px;padding:16px}
  button:hover:not(:disabled){filter:brightness(1.08)}

  #mapa{height:250px;border-radius:11px;border:1.5px solid var(--borda);margin-top:14px}
  .achado{background:var(--creme);border-left:4px solid var(--laranja);border-radius:0 9px 9px 0;
    padding:15px 17px;margin-top:14px;font-size:14.5px;line-height:1.65}
  .achado .cod{font-size:24px;color:var(--laranja);font-weight:700;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;display:block;margin:2px 0 6px}
  .aviso{background:#fdf6e8;border:1px solid #ecdcb8;border-radius:9px;padding:13px 15px;
    font-size:13.5px;line-height:1.6;color:#6b5a2f;margin-top:14px}
  .erro{color:#a33;font-size:13.5px;margin-top:8px;display:none}

  .resumo{font-size:14.5px;line-height:1.75}
  .resumo dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#9a9a9a;margin-top:12px}
  .resumo dd{margin:1px 0 0;font-weight:600}

  .rodape{text-align:center;font-size:12.5px;color:var(--texto2);margin-top:26px;
    line-height:1.7;padding-top:18px;border-top:1px solid rgba(46,68,83,.09)}
  .rodape a{color:var(--laranja)}
  .carregando{text-align:center;color:var(--texto2);padding:40px 0;font-size:14.5px}

  /* anexo e consentimento (06/09/2026) */
  .consent{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--borda);
    border-radius:10px;padding:14px 15px;margin-top:16px;font-size:13.5px;line-height:1.55;background:#fff}
  .consent input{accent-color:var(--laranja);width:17px;height:17px;flex:0 0 auto;margin:2px 0 0}
  .consent.marcada{border-color:var(--laranja);background:#fff8f2}
  .enviando{font-size:13.5px;color:var(--texto2);margin-top:12px}
  .ok{background:#eef7f0;border:1px solid #bfe0c8;border-radius:9px;padding:13px 15px;
    font-size:13.5px;color:#2f6b41;margin-top:14px;line-height:1.6}

  /* cartorio (06/09/2026) */
  .cartorio{background:#fff;border:1.5px solid var(--borda);border-left:4px solid var(--petroleo);
    border-radius:0 9px 9px 0;padding:14px 16px;margin-top:12px;font-size:14.5px;line-height:1.6}
  .cartorio .qual{font-size:16.5px;font-weight:700;color:var(--petroleo);display:block;margin:3px 0 5px}
  .cartorio .ressalva{font-size:12.5px;color:var(--texto2);margin-top:8px;display:block}
  .cartorio.duvida{border-left-color:#c9a227;background:#fdf9ef}
  .cartorio.exato{border-left-color:#3f8f5a;background:#f2f9f4}
  .cnm-caixa{margin-top:14px;border:1.5px dashed var(--borda);border-radius:10px;padding:14px;background:#fff}
  .cnm-caixa .titulo{font-size:13px;font-weight:600;margin-bottom:4px}
  .cnm-caixa .onde{font-size:12.5px;color:var(--texto2);margin-bottom:9px;line-height:1.5}




  .laudo{border:1px solid var(--borda);border-radius:12px;overflow:hidden;margin-bottom:22px}
  .laudo .cabeca{background:var(--petroleo);color:#fff;padding:13px 18px}
  .laudo .cabeca .t{font-size:15px;font-weight:700}
  .laudo .cabeca .s{font-size:11.5px;opacity:.8;margin-top:2px}
  .laudo .corpo{background:#fff;padding:6px 18px 14px}
  .laudo .linha{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
    border-bottom:1px solid #f1ece4;font-size:14.5px}
  .laudo .linha:last-child{border-bottom:none}
  .laudo .rot{color:var(--texto2);flex:0 0 auto}
  .laudo .val{font-weight:700;color:var(--petroleo);text-align:right;
    font-variant-numeric:tabular-nums}
  .laudo .val.destaque{color:var(--laranja);font-size:16px}
  .laudo .nota{background:var(--creme);padding:11px 18px;font-size:12px;
    color:var(--texto2);line-height:1.5;border-top:1px solid var(--borda)}
  .nota-mapa{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--texto2);
    line-height:1.5;margin-top:9px}
  .nota-mapa button{background:#fff;border:1.5px solid var(--borda);border-radius:20px;
    padding:5px 13px;font-size:12px;font-weight:600;color:var(--petroleo);cursor:pointer;
    white-space:nowrap;flex:0 0 auto}
  .nota-mapa button:hover{border-color:var(--laranja);color:var(--laranja)}
  /* consentimento em destaque quando falta marcar */
  @keyframes chama {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,105,0,.55); border-color: var(--laranja) }
    50%     { box-shadow: 0 0 0 7px rgba(255,105,0,0); border-color: #ffab6b }
  }
  .consent.faltando{ animation: chama 1.15s ease-out 3; border-color:var(--laranja);
    background:#fff4ea }
  .consent.faltando span{ font-weight:600 }
  @media (prefers-reduced-motion: reduce){ .consent.faltando{ animation:none } }
  .aviso-limite{background:#fdf6e8;border:1px solid #ecdcb8;border-radius:9px;
    padding:13px 15px;font-size:13.5px;line-height:1.6;color:#6b5a2f;margin-top:12px}
  /* etiqueta de numero predial dos vizinhos */
  .numero-vizinho{background:rgba(46,68,83,.62);color:#fff;border-radius:9px;
    padding:0 5px;font-size:9.5px;font-weight:600;white-space:nowrap;
    border:1px solid rgba(255,255,255,.35)}
  /* mapa e confirmacao por clique (06/09/2026) */
  #mapa{height:330px}
  .dica-mapa{background:#fff8f2;border:1.5px solid var(--laranja);border-radius:9px;
    padding:11px 14px;margin-top:12px;font-size:14px;line-height:1.55}
  .dica-mapa strong{color:var(--laranja)}
  .ficha{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .ficha .item{background:#fff;border:1px solid var(--borda);border-radius:9px;padding:11px 13px}
  .ficha .rot{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9a9a9a;font-weight:700}
  .ficha .val{font-size:17px;font-weight:700;color:var(--petroleo);margin-top:3px;
    font-variant-numeric:tabular-nums}
  .ficha .val.destaque{color:var(--laranja)}
  @media (max-width:560px){ .ficha{grid-template-columns:1fr} }
  @media (max-width:560px){ .opcoes.duas{grid-template-columns:1fr} .cartao{padding:24px 20px} }
</style>
</head>

  <textarea name="relato"></textarea><input name="consentimento">
</form>

<script>
// ---------------------------------------------------------------------------
// Simulador em etapas. Sem servidor e sem banco: o resultado é montado como
// mensagem e entregue no WhatsApp da Ana, já preenchido.
// ---------------------------------------------------------------------------
const ZAP = '5519999913300';

const resposta = {
  rua: '', numero: '', codCart: '', bairro: '', zona: '', coords: null,
  // coords = ponto do endereco digitado; clique = ponto que a pessoa marcou
  // no mapa. Eram o mesmo campo, e por isso a volta perdia o clique.
  clique: null, cliqueDe: '',
  tipo: '', situacao: '', area: '', planta: '', documentos: [],
  tentouAntes: '', protocolo: '', nome: '', whatsapp: '', relato: '',
  consentimento: false, cartorio: '', matriculaNum: '',
  macrozona: '', quarteirao: '', areaLote: '', matricula: '',
};

let etapa = 0;
let ruas = [], terrenos = [];
let mapa = null, marcador = null;

const semAcento = s => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
// as duas bases da Prefeitura escrevem o logradouro de formas diferentes;
// tirar o tipo ("RUA", "AVENIDA"...) dos dois lados é o que faz casar
const TIPO_LOGRADOURO = /^(RUA|R|AVENIDA|AV|TRAVESSA|TV|PRACA|PRAÇA|PC|ALAMEDA|AL|ESTRADA|EST|RODOVIA|ROD|VIELA|LARGO|MARGINAL|VIA|PASSAGEM|COMPLEXO|ACESSO)\s+/;
const chaveRua = s => semAcento(s).trim().replace(TIPO_LOGRADOURO, '').trim();

const WMS = 'https://wms2.campinas.sp.gov.br/wmsmap/wms_zoneamento.map';
const CAMPINAS_CENTRO = [-22.9056, -47.0608];  // Catedral, centro geografico util
// O servidor da Prefeitura codifica DE NOVO parâmetros que já chegam
// codificados ("%2F" vira "%252F") e devolve erro no lugar da imagem.
// Por isso a URL é montada à mão, com ":" e "/" literais.
const CamadaPMC = L.TileLayer.extend({
  initialize: function (camada, opts) { this._camada = camada; L.TileLayer.prototype.initialize.call(this, WMS, opts); },
  getTileUrl: function (coords) {
    const b = this._tileCoordsToBounds(coords);
    const sw = this._map.options.crs.project(b.getSouthWest());
    const ne = this._map.options.crs.project(b.getNorthEast());
    return WMS + '?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=' + this._camada +
           '&STYLES=&SRS=EPSG:3857&FORMAT=' + this.options.formato +
           '&TRANSPARENT=' + this.options.transparente + '&WIDTH=256&HEIGHT=256&BBOX=' +
           [sw.x, sw.y, ne.x, ne.y].join(',');
  }
});

const etapas = [
  {
    titulo: 'Onde fica o imóvel?',
    ajuda: 'Digite a rua e o número. Vamos localizar na base da Prefeitura de Campinas.',
    render: () => `
      <label class="campo" for="rua">Rua</label>
      <input type="text" id="rua" placeholder="Comece a digitar o nome da rua" autocomplete="off" value="${esc(resposta.rua)}">
      <ul class="sugestoes" id="sugestoes"></ul>
      <label class="campo" for="numero">Número</label>
      <input type="text" id="numero" placeholder="Ex: 194" value="${esc(resposta.numero)}">
      <div class="erro" id="erroEndereco"></div>
      <div id="resultadoBusca"></div>`,
    aoEntrar: montarBuscaEndereco,
    valida: () => {
      const r = document.getElementById('rua').value.trim();
      const n = document.getElementById('numero').value.trim();
      if (!r) return 'Informe a rua do imóvel.';
      resposta.rua = r; resposta.numero = n;
      // busca aqui tambem: se a pessoa digitar e clicar direto em "Proximo",
      // o evento de saida do campo pode nao disparar. Mas nunca refazer quando ja
      // ha codigo: o ramo de "nao encontrado" zeraria o que veio do clique no mapa.
      if (!resposta.codCart) buscarImovel();
      return null;
    }
  },
  {
    titulo: 'Que tipo de imóvel é?',
    ajuda: 'Isso define qual legislação se aplica ao caso.',
    render: () => escolha('tipo', [
      'Casa', 'Sobrado', 'Apartamento', 'Comercial', 'Galpão', 'Terreno sem construção'
    ], true),
    valida: () => resposta.tipo ? null : 'Escolha o tipo de imóvel.'
  },
  {
    titulo: 'Qual é a situação hoje?',
    ajuda: 'Pode marcar a que mais se aproxima — ajustamos depois na conversa.',
    render: () => escolha('situacao', [
      'Construí sem projeto aprovado',
      'Ampliei ou reformei sem aprovação',
      'Construí diferente do projeto aprovado',
      'Comprei o imóvel já irregular',
      'Preciso do Habite-se',
      'Preciso averbar a construção na matrícula',
      'Recebi multa ou notificação da Prefeitura',
      'Ainda não sei dizer'
    ]),
    valida: () => resposta.situacao ? null : 'Escolha a situação do imóvel.'
  },
  {
    titulo: 'Área construída e documentação',
    ajuda: 'Informe a área aproximada e se possui planta do imóvel.',
    render: () => `
      <label class="campo" for="area">Área construída aproximada</label>
      <input type="number" id="area" placeholder="Ex: 150" value="${esc(resposta.area)}" min="1">
      <div style="font-size:13px;color:var(--texto2);margin-top:5px">em metros quadrados — pode ser estimativa</div>
      <label class="campo">Possui planta do imóvel? (física ou digital)</label>
      ${escolha('planta', ['Sim', 'Não', 'Não sei'], true)}
      <label class="campo">Documentos disponíveis (opcional)</label>
      ${multiEscolha('documentos', ['IPTU', 'Matrícula', 'Alvará antigo', 'Habite-se / CCO', 'Projeto antigo'])}`,
    valida: () => {
      resposta.area = document.getElementById('area').value.trim();
      return resposta.planta ? null : 'Informe se possui planta do imóvel.';
    }
  },
  {
    titulo: 'Já tentou regularizar antes?',
    ajuda: 'Se já houve um processo, o caminho muda — e costuma ser mais rápido.',
    render: () => `
      ${escolha('tentouAntes', ['Sim, já protocolei', 'Sim, mas foi indeferido', 'Não, nunca tentei'], true)}
      <label class="campo" for="protocolo">Número do protocolo, se souber (opcional)</label>
      <input type="text" id="protocolo" placeholder="Ex: 2024/12345" value="${esc(resposta.protocolo)}">`,
    valida: () => {
      resposta.protocolo = document.getElementById('protocolo').value.trim();
      return resposta.tentouAntes ? null : 'Escolha uma das opções.';
    }
  },
  {
    titulo: 'Para onde enviamos o diagnóstico?',
    ajuda: 'Retornamos em até 24 horas úteis, pelo WhatsApp.',
    render: () => `
      <label class="campo" for="nome">Seu nome</label>
      <input type="text" id="nome" placeholder="Nome completo" value="${esc(resposta.nome)}">
      <label class="campo" for="whatsapp">Seu WhatsApp</label>
      <input type="text" id="whatsapp" placeholder="(19) 90000-0000" value="${esc(resposta.whatsapp)}">
      <label class="campo" for="relato">Quer contar mais alguma coisa? (opcional)</label>
      <textarea id="relato" placeholder="Escreva aqui o que achar importante">${esc(resposta.relato)}</textarea>
      <label class="consent" id="rotuloConsent">
        <input type="checkbox" id="consentimento" ${resposta.consentimento ? 'checked' : ''}>
        <span>Autorizo o contato sobre o meu caso.</span>
      </label>
      <div class="erro" id="erroContato"></div>`,
    valida: () => {
      resposta.nome = document.getElementById('nome').value.trim();
      resposta.whatsapp = document.getElementById('whatsapp').value.trim();
      resposta.relato = document.getElementById('relato').value.trim();
      resposta.consentimento = document.getElementById('consentimento').checked;
      if (!resposta.nome) return 'Informe seu nome.';
      if (resposta.whatsapp.replace(/\D/g, '').length < 10) return 'Informe um WhatsApp válido, com DDD.';
      if (!resposta.consentimento) {
        const cx = document.getElementById('rotuloConsent');
        if (cx) { cx.classList.remove('faltando'); void cx.offsetWidth; cx.classList.add('faltando'); }
        return 'Marque a autorização de contato para continuar.';
      }
      return null;
    }
  },
  { titulo: 'Tudo pronto', ajuda: 'Confira o resumo e envie para a engenheira responsável.', final: true }
];

// ---------------------------------------------------------------------------
function esc(s) {
  return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
}

function escolha(campo, itens, duas) {
  return `<div class="opcoes ${duas ? 'duas' : ''}">` + itens.map(i => `
    <label class="opcao ${resposta[campo] === i ? 'marcada' : ''}">
      <input type="radio" name="${campo}" value="${esc(i)}" ${resposta[campo] === i ? 'checked' : ''}>
      <span>${esc(i)}</span>
    </label>`).join('') + '</div>';
}

function multiEscolha(campo, itens) {
  return `<div class="opcoes duas">` + itens.map(i => `
    <label class="opcao ${resposta[campo].includes(i) ? 'marcada' : ''}">
      <input type="checkbox" name="${campo}" value="${esc(i)}" ${resposta[campo].includes(i) ? 'checked' : ''}>
      <span>${esc(i)}</span>
    </label>`).join('') + '</div>';
}

function ligarConsentimento() {
  const c = document.getElementById('consentimento');
  if (!c) return;
  c.addEventListener('change', () => {
    const cx = document.getElementById('rotuloConsent');
    cx.classList.toggle('marcada', c.checked);
    if (c.checked) cx.classList.remove('faltando');
  });
  if (c.checked) document.getElementById('rotuloConsent').classList.add('marcada');
}

function ligarOpcoes() {
  document.querySelectorAll('.opcao input').forEach(inp => {
    inp.addEventListener('change', () => {
      const campo = inp.name;
      if (inp.type === 'radio') {
        resposta[campo] = inp.value;
        // escopo em .opcao: o formulario oculto do Netlify tem campos de mesmo nome
        document.querySelectorAll(`.opcao input[name="${campo}"]`).forEach(o =>
          o.closest('.opcao').classList.toggle('marcada', o.checked));
      } else {
        const lista = resposta[campo];
        const i = lista.indexOf(inp.value);
        if (inp.checked && i < 0) lista.push(inp.value);
        if (!inp.checked && i >= 0) lista.splice(i, 1);
        inp.closest('.opcao').classList.toggle('marcada', inp.checked);
      }
    });
  });
}

function montarBuscaEndereco() {
  const campoRua = document.getElementById('rua');
  const lista = document.getElementById('sugestoes');

  campoRua.addEventListener('input', () => {
    const q = semAcento(campoRua.value.trim());
    lista.innerHTML = '';
    if (q.length < 3) { lista.style.display = 'none'; return; }
    const achados = ruas.filter(r => r.b.includes(q)).slice(0, 10);
    if (!achados.length) { lista.style.display = 'none'; return; }
    achados.forEach(r => {
      const li = document.createElement('li');
      li.textContent = r.n;
      li.onclick = () => { campoRua.value = r.n; lista.style.display = 'none'; buscarImovel(); };
      lista.appendChild(li);
    });
    lista.style.display = 'block';
  });

  document.getElementById('numero').addEventListener('change', buscarImovel);
  document.addEventListener('click', e => { if (!e.target.closest('#rua,#sugestoes')) lista.style.display = 'none'; });

  // voltando para esta etapa: reconstruir o que a pessoa ja tinha na tela.
  // os campos de texto sozinhos nao trazem de volta mapa, lote nem ficha.
  if (resposta.rua && resposta.numero) {
    buscarImovel();
    restauraClique();
  }
}

function restauraClique() {
  // volta ao ponto que a pessoa marcou - nao ao ponto do endereco.
  const p = resposta.clique;

  // esperar o mapa existir em vez de chutar um tempo: se o mapa demorasse
  // mais que o timeout fixo, a restauracao falhava sem avisar ninguem.
  let tentativas = 0;
  (function tenta() {
    if (mapa && document.getElementById('mapa')) { consultarPonto(p[0], p[1], true); return; }
    if (++tentativas < 50) setTimeout(tenta, 100);
  })();
}

// ---------------------------------------------------------------------------
// Vizinhos conhecidos da rua: servem de referencia para a pessoa achar o lote.
// Sem isso o mapa abria afastado e ela precisava reconhecer a casa no meio do
// bairro - foi o que a Ana apontou.
// ---------------------------------------------------------------------------
function marcarVizinhos(rua) {
  const chave = chaveRua(rua);
  const pontos = terrenos
    .filter(t => chaveRua(t.LOGRADOURO) === chave && t.c && t.NUMERO)
    .filter((t, i, a) => a.findIndex(x => String(x.NUMERO) === String(t.NUMERO)) === i);
  if (!pontos.length) return null;

  pontos.forEach(t => {
    L.marker([t.c[1], t.c[0]], {
      icon: L.divIcon({ className: '', html: '<div class="numero-vizinho">' + t.NUMERO + '</div>',
                        iconSize: null })
    }).addTo(mapa);
  });
  return L.latLngBounds(pontos.map(t => [t.c[1], t.c[0]]));
}

function desenharMapa(coord, precisa, rua) {
  const el = document.getElementById('mapa');
  if (!el) return;
  if (mapa) { mapa.remove(); mapa = null; }
  // comeca com a cidade toda e voa ate o imovel: mostra onde ele fica em Campinas
  // antes de aproximar, para a pessoa se situar
  mapa = L.map(el, { zoomControl: true, scrollWheelZoom: false })
          .setView(CAMPINAS_CENTRO, 11);

  // Esri World Imagery: recente e sem chave. A ortofoto da Prefeitura e de 2014 -
  // util para comparar, mas mostra terreno vazio onde hoje ha construcao.
  camadaSatelite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 20, maxNativeZoom: 19, attribution: 'Imagem: Esri, Maxar, Earthstar Geographics' });
  camadaOrto = new CamadaPMC('2014_Ortofoto', { formato: 'image/jpeg', transparente: 'false', maxZoom: 20 });
  const ruasBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '© OpenStreetMap' });
  camadaLotes = new CamadaPMC('propriedades', { formato: 'image/png', transparente: 'true', maxZoom: 20 });

  // abre na ortofoto: e a base em que as linhas de lote batem com a imagem.
  // no satelite obliquo a construcao tomba e o clique cai no lote vizinho.
  camadaOrto.addTo(mapa); camadaLotes.addTo(mapa);
  baseAtual = 'orto';
  L.control.layers({ 'Satélite (atual)': camadaSatelite, 'Foto aérea 2014 (Prefeitura)': camadaOrto, 'Mapa de ruas': ruasBase },
                   { 'Limites de lote': camadaLotes }).addTo(mapa);
  mapa.on('click', e => consultarPonto(e.latlng.lng, e.latlng.lat));

  // anel fino em vez de ponto cheio: o marcador nao pode cobrir o terreno
  // que ele esta apontando
  anelAlvo = L.circleMarker([coord[1], coord[0]], {
    radius: 16, weight: 2, color: '#FF6900', opacity: .9, fill: false
  }).addTo(mapa);
  anelAlvo.bindTooltip('Seu imóvel', { direction: 'top' });

  const limites = (!precisa && rua) ? marcarVizinhos(rua) : null;

  // pequena pausa para a pessoa ver o ponto na cidade antes da aproximacao
  const aproxima = (animado) => {
    const opc = animado ? { duration: 2.2 } : { animate: false };
    if (limites) {
      const o = Object.assign({ padding: [40, 40], maxZoom: 18 }, opc);
      animado ? mapa.flyToBounds(limites, o) : mapa.fitBounds(limites, o);
    } else {
      const z = precisa ? 19 : 18;
      animado ? mapa.flyTo([coord[1], coord[0]], z, opc)
              : mapa.setView([coord[1], coord[0]], z, opc);
    }
  };
  setTimeout(() => {
    aproxima(jaVoou ? false : true);   // o voo e para a primeira vez; ao voltar, direto
    jaVoou = true;
    // se a animacao nao rodar (movimento reduzido, aba em segundo plano), garante o destino
    setTimeout(() => { if (mapa && mapa.getZoom() < 14) aproxima(false); }, 3200);
  }, 900);
}

const MINUSCULAS = new Set(['DE','DA','DO','DAS','DOS','E']);

}

// ---------------------------------------------------------------------------
// Envio para o Netlify. O POST vai para a propria pagina, em multipart, que e o
// unico formato que carrega arquivo. Se falhar, o resumo do WhatsApp continua
// funcionando - o lead nunca depende so disto.
let jaEnviou = false;
async function enviarParaNetlify() {
  if (jaEnviou) return;
  jaEnviou = true;
  const dados = new FormData();
  dados.append('form-name', 'diagnostico');
  dados.append('nome', resposta.nome);
  dados.append('whatsapp', resposta.whatsapp);
  dados.append('endereco', resposta.rua + (resposta.numero ? ', ' + resposta.numero : ''));
  dados.append('codigo_cartografico', resposta.codCart || 'nao localizado');
  dados.append('bairro', resposta.bairro);
  dados.append('zona', resposta.zona);
  dados.append('tipo', resposta.tipo);
  dados.append('situacao', resposta.situacao);
  dados.append('area', resposta.area);
  dados.append('planta', resposta.planta);
  dados.append('documentos', resposta.documentos.join(', '));
  dados.append('tentou_antes', resposta.tentouAntes);
  dados.append('protocolo', resposta.protocolo);
  dados.append('relato', resposta.relato);
  dados.append('consentimento', resposta.consentimento ? 'sim' : 'nao');

  const aviso = document.getElementById('avisoEnvio');
  try {
    const r = await fetch('/', { method: 'POST', body: dados });
    if (!r.ok) throw new Error('resposta ' + r.status);
    if (aviso) aviso.innerHTML = '<div class="ok"><strong>Recebido.</strong> Seu contato' +
      ' chegou at\u00e9 n\u00f3s. Voc\u00ea pode enviar tamb\u00e9m pelo WhatsApp, se preferir falar agora.</div>';
  } catch (e) {
    // silencioso de proposito: quem preencheu nao tem culpa de rede, e o WhatsApp resolve
    if (aviso) aviso.innerHTML = '';
  }
}

// Cartorio de registro de imoveis
// ---------------------------------------------------------------------------
function validaCNM(txt) {
  const limpo = (txt || '').replace(/[^\d]/g, '');
  if (limpo.length !== 16) return null;
  const cns = limpo.slice(0, 6), livro = limpo[6], matricula = limpo.slice(7, 14), dv = limpo.slice(14);
  // ISO 7064 MOD 97-10, o mesmo padrao do IBAN
  const esperado = String(98 - (Number(limpo.slice(0, 14)) * 100) % 97).padStart(2, '0');
  return {cns, livro, matricula: Number(matricula), dv, valido: esperado === dv, esperado};
}

function cartorioPorCNM(txt) {
  const r = validaCNM(txt);
  if (!r) return null;
  r.ri = CARTORIOS.cns[r.cns] || null;
  return r;
}

function cartorioPorCodigo(cod) {
  const n = String(cod || '').replace(/\D/g, '');
  if (n.length < 4) return null;
  // do mais preciso para o mais grosseiro: quarteirao, sub-setor, setor
  for (const [corte, tab, rotulo] of [[8, CARTORIOS.q8, 'quarteirão'],
                                      [6, CARTORIOS.s6, 'sub-setor'],
                                      [4, CARTORIOS.s4, 'setor']]) {
    if (n.length < corte) continue;
    const achado = tab[n.slice(0, corte)];
    if (achado) return {ri: achado.ri, confianca: achado.c, registros: achado.n,
                        chave: n.slice(0, corte), nivel: rotulo, onde: achado.onde};
  }
  return {ri: null, confianca: 'sem dado', chave: n.slice(0, 4), nivel: 'setor'};
}




function numeroDigitado() {
  // o campo e a fonte da verdade aqui: resposta.numero so e preenchido ao avancar
  const el = document.getElementById('numero');
  return String((el && el.value) || resposta.numero || '').replace(/\D/g, '');
}

function enderecoDoCodigo(cod) {
  const alvo = String(cod || '').replace(/\D/g, '');
  const r = terrenos.find(t => String(t.COD_CART) === alvo);
  return r ? { rua: r.LOGRADOURO || '', numero: String(r.NUMERO || '') } : null;
}

function blocoMatricula(cod) {
  if (typeof MATRICULAS === 'undefined') return '';
  const ns = MATRICULAS[String(cod || '').replace(/\D/g, '')];
  if (!ns || !ns.length) return '';
  if (ns.length > 1) {
    return `<div class="cartorio duvida">
      <strong>Matr&iacute;cula</strong>
      <span class="qual">${ns.length} matr&iacute;culas neste c&oacute;digo</span>
      &Eacute; o padr&atilde;o de condom&iacute;nio: cada unidade tem a sua. A do seu im&oacute;vel
      sai na consulta ao cart&oacute;rio, com o n&uacute;mero do apartamento.</div>`;
  }
  const onde = enderecoDoCodigo(cod);
  const digitado = numeroDigitado();
  const doCodigo = onde ? String(onde.numero).replace(/\D/g, '') : '';
  // se o lote clicado nao e o do numero digitado, avisar: e o erro que mais custa caro
  const divergente = digitado && doCodigo && Number(digitado) !== Number(doCodigo);
  const procedencia = onde
    ? `<span class="ressalva">Cadastrada para <strong>${esc(onde.rua)}, ${esc(onde.numero)}</strong>
       &mdash; informada pelo requerente no protocolo. Confirme no cart&oacute;rio antes de pedir
       certid&atilde;o.</span>`
    : `<span class="ressalva">Informada pelo requerente no protocolo &mdash; confirme no
       cart&oacute;rio antes de pedir certid&atilde;o.</span>`;
  if (divergente) {
    return `<div class="cartorio duvida">
      <strong>Matr&iacute;cula</strong>
      <span class="qual">${ns[0].toLocaleString('pt-BR')} &mdash; do n&ordm; ${esc(onde.numero)}</span>
      <strong>Este n&atilde;o &eacute; o n&uacute;mero que voc&ecirc; digitou (${esc(numeroDigitado())}).</strong>
      O ponto clicado no mapa caiu no lote vizinho. Clique de novo, sobre o im&oacute;vel certo.
      ${procedencia}</div>`;
  }
  return `<div class="cartorio">
    <strong>Matr&iacute;cula</strong>
    <span class="qual">${ns[0].toLocaleString('pt-BR')}</span>
    Consta assim no processo da Prefeitura para este c&oacute;digo cartogr&aacute;fico.
    ${procedencia}</div>`;
}

function blocoCartorio(cod, bairro) {
  const r = cartorioPorCodigo(cod);
  if (!r) return '';
  const info = r.ri ? ENDERECO_RI[r.ri] : null;
  if (!r.ri || r.confianca === 'sem dado') {
    return `<div class="cartorio duvida">

  }
  if (r.confianca === 'baixa') {
    return `<div class="cartorio duvida">

      <span class="qual">Prov&aacute;vel: ${info.nome}</span>
      Esta regi&atilde;o fica <strong>na divisa entre cart&oacute;rios</strong> &mdash; no centro de Campinas a
      divis&atilde;o chega a ser rua a rua, e por faixa de numera&ccedil;&atilde;o.
      <span class="ressalva">Confirme antes de pedir certid&atilde;o. Se voc&ecirc; tem a matr&iacute;cula em m&atilde;os,
      o campo abaixo d&aacute; a resposta exata.</span></div>`;
  }
  // guarda para o laudo final: sem isso o cartorio aparecia so na tela do mapa
  if (r.ri && info && r.confianca !== 'baixa') resposta.cartorio = info.nome;
  const forca = r.confianca === 'confirmada' ? ('confirmado em matr&iacute;cula emitida' + (r.onde ? ' (' + r.onde + ')' : ''))
                                             : `${r.registros} im&oacute;veis deste setor na mesma serventia`;
  return `<div class="cartorio">
    <strong>Cart&oacute;rio de registro</strong>
    <span class="qual">${info.nome}</span>
    Refer&ecirc;ncia obtida pelo ${r.nivel} <strong>${r.chave}</strong> do c&oacute;digo cartogr&aacute;fico &mdash; ${forca}.
    <span class="ressalva">Refer&ecirc;ncia para orienta&ccedil;&atilde;o. A confirma&ccedil;&atilde;o definitiva
    &eacute; do pr&oacute;prio cart&oacute;rio.</span></div>`;
}

function montarCNM() {
  const campo = document.getElementById('cnm');
  if (!campo) return;
  const alvo = document.getElementById('respostaCNM');
  campo.addEventListener('input', () => {
    const t = campo.value.trim();
    if (t.replace(/\D/g, '').length < 16) { alvo.innerHTML = ''; return; }
    const r = cartorioPorCNM(t);
    if (!r || !r.valido) {
      alvo.innerHTML = `<div class="cartorio duvida"><strong>C&oacute;digo n&atilde;o confere</strong>
        <span class="ressalva">O d&iacute;gito verificador n&atilde;o bate &mdash; confira se algum n&uacute;mero
        saiu trocado. Esperado: ${r ? r.esperado : '--'}</span></div>`;
      return;
    }
    const info = r.ri ? ENDERECO_RI[r.ri] : null;
    resposta.cartorio = info ? info.nome : '';
    resposta.matriculaNum = r.matricula;
    alvo.innerHTML = `<div class="cartorio exato">
      <strong>C&oacute;digo v&aacute;lido &#10003;</strong>
      <span class="qual">${info ? info.nome : 'Serventia ' + r.cns}</span>
      Livro ${r.livro} &middot; matr&iacute;cula <strong>${r.matricula.toLocaleString('pt-BR')}</strong>
      <span class="ressalva">Identifica&ccedil;&atilde;o exata: vem do pr&oacute;prio n&uacute;mero da matr&iacute;cula,
      conferido pelo d&iacute;gito verificador.</span></div>`;
  });
}



// ---------------------------------------------------------------------------
// Limites de consulta.
// O simulador existe para quem quer saber do proprio imovel. Sem limite, ele
// vira base de consulta aberta da cidade inteira - e nao e para isso que a
// Ana pagou o levantamento.
// ---------------------------------------------------------------------------
const LIMITE_RAIO = 250;        // metros do endereco informado
const LIMITE_CONSULTAS = 25;    // por janela; 12 era pouco para quem confere varios lotes
const JANELA_MIN = 10;          // minutos
let pontoReferencia = null;     // definido quando o endereco e localizado

function distancia(a, b) {
  const kx = 111320 * Math.cos(a[1] * Math.PI / 180), ky = 110540;
  return Math.hypot((a[0] - b[0]) * kx, (a[1] - b[1]) * ky);
}

function historico() {
  try { return JSON.parse(localStorage.getItem('consultas') || '[]'); }
  catch (e) { return []; }   // navegador que bloqueia armazenamento: segue sem limite
}

function registraConsulta() {
  try {
    const agora = Date.now();
    const lista = historico().filter(t => agora - t < JANELA_MIN * 60000);
    lista.push(agora);
    localStorage.setItem('consultas', JSON.stringify(lista));
  } catch (e) { /* sem armazenamento, sem contagem */ }
}

function minutosDeEspera() {
  const agora = Date.now();
  const lista = historico().filter(t => agora - t < JANELA_MIN * 60000);
  if (lista.length < LIMITE_CONSULTAS) return 0;
  return Math.max(1, Math.ceil((JANELA_MIN * 60000 - (agora - lista[0])) / 60000));
}

function avisaLimite(texto) {
  const alvo = document.getElementById('fichaPonto');
  if (!alvo) return;
  alvo.innerHTML = '<div class="aviso-limite">' + texto + '</div>';
  // sem isso a recusa podia ficar fora da tela e parecer que o clique nao funciona
  alvo.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// ---------------------------------------------------------------------------
// Consulta pelo ponto clicado, nos servicos abertos da Prefeitura de Campinas.
// Cobrem a cidade toda - a base de alvaras cobre so os 13.740 processos.
// ---------------------------------------------------------------------------
const PMC = 'https://zoneamento.campinas.sp.gov.br/novo_zoneamento/';
let contornoLote = null;
let anelAlvo = null;
let jaVoou = false;
let camadaSatelite = null, camadaOrto = null, camadaLotes = null;

function areaPoligono(anel) {
  const lat0 = anel.reduce((s, p) => s + p[1], 0) / anel.length;
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540;
  let s = 0;
  for (let i = 0; i < anel.length - 1; i++)
    s += (anel[i][0] * kx) * (anel[i + 1][1] * ky) - (anel[i + 1][0] * kx) * (anel[i][1] * ky);
  return Math.abs(s) / 2;
}

async function consultarPonto(lon, lat, interno) {
  if (!interno) {
    // fora do raio do endereco informado: o simulador nao e para varrer a cidade
    if (pontoReferencia && distancia([lon, lat], pontoReferencia) > LIMITE_RAIO) {
      avisaLimite('<strong>Clique no im&oacute;vel do endere&ccedil;o que voc&ecirc; informou.</strong><br>' +
        'A consulta vale para o endere&ccedil;o pesquisado e a vizinhan&ccedil;a imediata. ' +
        'Para outro im&oacute;vel, volte e digite o endere&ccedil;o dele.');
      return;
    }
    const espera = minutosDeEspera();
    if (espera) {
      avisaLimite('<strong>Muitas consultas seguidas.</strong><br>' +
        'Voc&ecirc; pode consultar de novo em cerca de ' + espera + ' minuto' + (espera > 1 ? 's' : '') +
        '. Se precisa de v&aacute;rios im&oacute;veis, fale com a engenheira pelo WhatsApp &mdash; ' +
        '&eacute; mais r&aacute;pido do que um a um por aqui.');
      return;
    }
    registraConsulta();
  }
  const alvo = document.getElementById('fichaPonto');
  if (alvo) alvo.innerHTML = '<div class="enviando">Consultando a base da Prefeitura&hellip;</div>';
  try {
    const [c, z] = await Promise.all([
      fetch(`${PMC}calc_cartografico.php?X=${lon.toFixed(7)}&Y=${lat.toFixed(7)}&srid=4326`).then(r => r.json()),
      fetch(`${PMC}calc_zona.php?X=${lon.toFixed(7)}&Y=${lat.toFixed(7)}`).then(r => r.json())
    ]);
    if (!c || !c.cod_cartografico) { if (alvo) alvo.innerHTML = ''; return; }

    resposta.codCart = c.cod_cartografico;
    // o aviso de "nao achamos o codigo" nao pode continuar na tela depois de
    // achar o codigo - contradiz o resultado logo abaixo dele
    const semCodigo = document.getElementById('avisoSemCodigo');
    if (semCodigo) semCodigo.remove();
    // a instrucao de clicar ja cumpriu a funcao
    document.querySelectorAll('.dica-mapa').forEach(e => e.remove());
    resposta.zona = z.zoneamento || resposta.zona;
    resposta.macrozona = z.macrozona || '';
    resposta.quarteirao = z.quarteirao_num || '';
    resposta.coords = [lon, lat];
    if (!interno) {
      // so o clique de verdade vira referencia de volta; a restauracao nao
      resposta.clique = [lon, lat];
      resposta.cliqueDe = enderecoAtual();
    }
    const end = enderecoDoCodigo(c.cod_cartografico);
    const dig = numeroDigitado();
    const doc = end ? String(end.numero).replace(/\D/g, '') : '';
    // matricula so entra no laudo se o lote clicado for mesmo o do numero digitado
    // o cartorio era gravado dentro de blocoCartorio, que saiu da etapa 1.
    // sem isso ele nao chegava ao laudo final.
    const rc = cartorioPorCodigo(c.cod_cartografico);
    resposta.cartorio = (rc && rc.ri && rc.confianca !== 'baixa' && ENDERECO_RI[rc.ri])
      ? ENDERECO_RI[rc.ri].nome : '';
    resposta.matricula = (dig && doc && Number(dig) !== Number(doc))
      ? '' : matriculaDoCodigo(c.cod_cartografico);

    let areaLote = null;
    if (c.poligono && contornoLote !== undefined) {
      try {
        const g = JSON.parse(c.poligono);
        const anel = g.coordinates[0];
        areaLote = areaPoligono(anel);
        resposta.areaLote = Math.round(areaLote);
        if (contornoLote) mapa.removeLayer(contornoLote);
        // com o lote desenhado o anel perde a funcao e so atrapalha
        if (anelAlvo) { mapa.removeLayer(anelAlvo); anelAlvo = null; }
        contornoLote = L.polygon(anel.map(p => [p[1], p[0]]),
          { color: '#FF6900', weight: 3, fillColor: '#FF6900', fillOpacity: .06 }).addTo(mapa);
        baseParaMedicao();
        mapa.flyToBounds(contornoLote.getBounds(), { padding: [30, 30], maxZoom: 19, duration: 1.4 });
      } catch (e) { /* sem poligono: segue so com o codigo */ }
    }
    if (alvo) alvo.innerHTML = confirmacaoPonto(areaLote);
  } catch (e) {
    if (alvo) alvo.innerHTML = '<div class="aviso">Não foi possível consultar agora. ' +
      'Você pode seguir — levantamos esses dados no diagnóstico.</div>';
  }
}

function matriculaDoCodigo(cod) {
  if (typeof MATRICULAS === 'undefined') return '';
  const ns = MATRICULAS[String(cod || '').replace(/\D/g, '')];
  return (ns && ns.length === 1) ? String(ns[0]) : '';
}



function confirmacaoPonto(areaLote) {
  // so o necessario para a pessoa saber que clicou no imovel certo.
  // o levantamento completo sai na tela final, que e onde ele serve.
  const a = areaLote ? Math.round(areaLote).toLocaleString('pt-BR') + ' m²' : '';
  return `<div class="cartorio exato" style="margin-top:12px">
    <strong>Imóvel localizado &#10003;</strong>
    <span class="qual">${resposta.codCart}</span>
    ${a ? 'Lote de <strong>' + a + '</strong>, pelo desenho oficial da Prefeitura. ' : ''}
    Zona, cartório e matrícula saem no resultado, ao final.
    <span class="ressalva">Não é o seu imóvel? Clique de novo, no lote certo.</span></div>`;
}

function fichaDoPonto(areaLote) {
  const it = (rot, val, destaque) => val
    ? `<div class="item"><div class="rot">${rot}</div><div class="val${destaque ? ' destaque' : ''}">${val}</div></div>` : '';
  return `
    <div class="ficha">
      ${it('Código cartográfico', resposta.codCart, true)}
      ${it('Área do lote', areaLote ? Math.round(areaLote).toLocaleString('pt-BR') + ' m²' : '')}
      ${it('Zona', resposta.zona)}
      ${it('Quarteirão', resposta.quarteirao)}
      ${it('Macrozona', resposta.macrozona)}
    </div>
    ${blocoCartorio(resposta.codCart, resposta.bairro)}
    ${blocoMatricula(resposta.codCart)}`;
}


// ---------------------------------------------------------------------------
// Alinhamento entre cadastro e imagem.
// O desenho do lote vem do levantamento topografico da Prefeitura; a imagem de
// satelite global tem erro de posicionamento proprio, de alguns metros. Onde os
// dois coincidem exatamente e sobre a ortofoto da propria Prefeitura.
// ---------------------------------------------------------------------------
let baseAtual = 'satelite';

// ---------------------------------------------------------------------------
// Base para medicao.
// A imagem de satelite e obliqua: construcao alta aparece deitada, e o desenho
// do lote parece cortar o predio. A ortofoto da Prefeitura e ortorretificada,
// entao e nela que o cadastro encaixa. Trocamos no momento em que isso importa.
// ---------------------------------------------------------------------------
function baseParaMedicao() {
  if (!mapa || !camadaOrto || baseAtual === 'orto') return;
  if (mapa.hasLayer(camadaSatelite)) mapa.removeLayer(camadaSatelite);
  camadaOrto.addTo(mapa);
  baseAtual = 'orto';
  if (camadaLotes) camadaLotes.bringToFront();
  const bt = document.getElementById('alinhar-base');
  if (bt) bt.textContent = 'Ver satélite atual';
}

function alternarBase() {
  if (!mapa || !camadaSatelite || !camadaOrto) return;
  const bt = document.getElementById('alinhar-base');
  if (baseAtual === 'orto') {
    mapa.removeLayer(camadaOrto); camadaSatelite.addTo(mapa); baseAtual = 'satelite';
    if (bt) bt.textContent = 'Voltar à foto oficial';
  } else {
    mapa.removeLayer(camadaSatelite); camadaOrto.addTo(mapa); baseAtual = 'orto';
    if (bt) bt.textContent = 'Ver satélite atual';
  }
  if (camadaLotes) camadaLotes.bringToFront();
}

function desenhar() {
  const e = etapas[etapa];
  document.getElementById('bolinhas').innerHTML = etapas.map((_, i) =>
    `<div class="bolinha ${i < etapa ? 'feita' : ''} ${i === etapa ? 'atual' : ''}"></div>`).join('');

  const corpo = e.final ? telaFinal() : e.render();
  if (e.final) setTimeout(enviarParaNetlify, 60);
  const nav = e.final ? '' : `
    <div class="navegacao">
      <button class="voltar" id="btVoltar" ${etapa === 0 ? 'style="visibility:hidden"' : ''}>← Voltar</button>
      <button class="proximo" id="btProximo">${etapa === etapas.length - 2 ? 'Ver resultado' : 'Próximo'} →</button>
    </div>`;

  document.getElementById('conteudo').innerHTML =
    `<h2>${esc(e.titulo)}</h2><p class="ajuda">${esc(e.ajuda)}</p>${corpo}${nav}`;

  ligarOpcoes();
  ligarConsentimento();
  if (e.aoEntrar) e.aoEntrar();

  const bt = document.getElementById('btProximo');
  if (bt) bt.onclick = () => {
    const erro = e.valida ? e.valida() : null;
    if (erro) { mostrarErro(erro); return; }
    etapa++; desenhar(); window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const bv = document.getElementById('btVoltar');
  if (bv) bv.onclick = () => { etapa--; desenhar(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}

function mostrarErro(msg) {
  let alvo = document.getElementById('erroEndereco') || document.getElementById('erroContato');
  if (!alvo) {
    alvo = document.createElement('div');
    alvo.className = 'erro';
    document.querySelector('.navegacao').before(alvo);
  }
  alvo.textContent = msg;
  alvo.style.display = 'block';
}

// ---------------------------------------------------------------------------
if (typeof RUAS === 'undefined') {
  document.getElementById('conteudo').innerHTML =
    '<div class="aviso">Não foi possível carregar a base de endereços. Recarregue a página.</div>';
} else {
  ruas = RUAS;
  terrenos = ALVARAS.filter(a => a.COD_CART);
  desenhar();
}
